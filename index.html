<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e0e0e">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
html.native body{-webkit-user-select:none;user-select:none}
html.native input,html.native textarea{-webkit-user-select:text;user-select:text}
</style>
</head>
<body>
<title>Flowfit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: single phone column. Greeting header, lime day-pill strip, rounded charcoal cards with colour-keyed stat labels. Floating pill nav; contextual dock above it. Sheets for secondary tasks. Dark-first. */
:root{
  --bg:#0e0e0e; --surface:#1a1a1a; --surface-2:#242424; --surface-3:#323232;
  --line:#272727; --fg:#fafafa; --muted:#a3a3a3; --faint:#686868;
  --accent:#bef264; --accent-ink:#151515; --accent-fg:#bef264; --accent-soft:rgba(190,242,100,.13); --accent-line:rgba(190,242,100,.5);
  --c-orange:#fb923c; --c-teal:#5eead4; --c-violet:#c4a1ff; --c-pink:#f9a8d4; --c-yellow:#fde047;
  --danger:#ff8a80; --scrim:rgba(0,0,0,.6); --shadow:0 20px 50px -20px rgba(0,0,0,.8);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,.8,.24,1);
  --r-xl:28px; --r-lg:24px; --r-md:18px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f4ef; --surface:#ffffff; --surface-2:#f1f2ec; --surface-3:#e3e5dd; --line:#e7e8e2;
  --fg:#121212; --muted:#6b6e66; --faint:#a3a69d; --accent:#bef264; --accent-ink:#151515; --accent-fg:#4f7d0b;
  --accent-soft:rgba(140,190,40,.16); --accent-line:rgba(110,160,20,.55);
  --c-orange:#ea6a0c; --c-teal:#0d9488; --c-violet:#8b5cf6; --c-pink:#db2777; --c-yellow:#ca8a04;
  --danger:#d93025; --scrim:rgba(20,22,18,.35); --shadow:0 20px 50px -24px rgba(30,40,10,.35); color-scheme:light } }
:root[data-theme="light"]{
  --bg:#f3f4ef; --surface:#ffffff; --surface-2:#f1f2ec; --surface-3:#e3e5dd; --line:#e7e8e2;
  --fg:#121212; --muted:#6b6e66; --faint:#a3a69d; --accent:#bef264; --accent-ink:#151515; --accent-fg:#4f7d0b;
  --accent-soft:rgba(140,190,40,.16); --accent-line:rgba(110,160,20,.55);
  --c-orange:#ea6a0c; --c-teal:#0d9488; --c-violet:#8b5cf6; --c-pink:#db2777; --c-yellow:#ca8a04;
  --danger:#d93025; --scrim:rgba(20,22,18,.35); --shadow:0 20px 50px -24px rgba(30,40,10,.35); color-scheme:light }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-line);outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tn{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.sm{font-size:13px}

#app{max-width:460px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:22px 200px}
#main{display:flex;flex-direction:column;gap:16px}

/* press + ripple feedback */
.tap{position:relative;overflow:hidden;transition:transform .35s var(--spring),background-color .25s var(--ease),color .2s,border-color .25s,opacity .2s;transform:translateZ(0)}
.tap:active{transform:scale(.95);transition-duration:.08s}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.22;pointer-events:none;transform:scale(0);animation:rip .55s var(--ease) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* headings */
.hello{display:flex;align-items:center;gap:14px;padding:6px 0 4px}
.hello .who{flex:1;min-width:0}
.hello h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:21px;flex:none;box-shadow:0 0 0 4px var(--accent-soft)}
.icon-round{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:6px 0 2px}
.page-head h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.page-head p{margin:6px 0 0;color:var(--muted)}
.sec{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.sec h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.link{color:var(--accent-fg);font-weight:600;font-size:14px;padding:6px 2px;border-radius:8px}
.link.plain{color:var(--muted);font-weight:500}
.link.danger{color:var(--danger)}

/* cards */
.card{background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0;border:1px solid var(--line)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-top h3{font-size:17px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--surface-2);border-radius:var(--r-md);padding:14px 16px}
.kv .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.kv .v{font-size:19px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.c-orange{color:var(--c-orange)} .c-teal{color:var(--c-teal)} .c-violet{color:var(--c-violet)} .c-pink{color:var(--c-pink)} .c-yellow{color:var(--c-yellow)} .c-lime{color:var(--accent-fg)}
.dot{width:7px;height:7px;border-radius:3px;display:inline-block;flex:none}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;background:var(--accent-soft);color:var(--accent-fg);font-size:12px;font-weight:600;white-space:nowrap}
.badge.solid{background:var(--accent);color:var(--accent-ink)}
.badge.neg{background:rgba(255,138,128,.14);color:var(--danger)}
.empty{gap:10px}
.empty h3{font-size:18px;font-weight:700}
.empty p{margin:0;color:var(--muted);line-height:1.5}
.hr{height:1px;background:var(--line);border:0;margin:0}

/* buttons */
.btn{height:54px;border-radius:999px;padding:0 24px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary,.day.sel,.navbar button[aria-current="page"],.chip[aria-pressed="true"],.chip[aria-selected="true"],.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#cbf77e 0%,#bef264 55%,#b2e655 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(60,90,0,.18)}
.btn-primary{background:linear-gradient(180deg,#cbf77e 0%,#bef264 55%,#b2e655 100%);color:var(--accent-ink)}
.btn-primary:active{box-shadow:inset 0 2px 3px rgba(60,90,0,.25)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:var(--surface-2);color:var(--fg);font-weight:600;font-size:15px}
.btn-line{border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:15px}
.btn-block{width:100%}
.btn-sm{height:44px;font-size:14px;padding:0 18px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1}

/* chips */
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:42px;padding:0 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap;color:var(--fg)}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.round{width:42px;padding:0;display:grid;place-items:center;border-color:var(--faint);background:transparent}

/* day strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:pan-y}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;border-radius:999px;font-size:12px;font-weight:600;color:var(--fg)}
.day b{font-size:13px;font-weight:500;color:var(--muted)}
.day i{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:-2px}
.day i.on{background:var(--accent)}
.day.today:not(.sel){color:var(--accent-fg)}
.day.sel{background:var(--accent);color:var(--accent-ink)}
.day.sel b{color:var(--accent-ink)}
.day.sel i.on{background:var(--accent-ink)}

/* nav pill */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));pointer-events:none}
.navbar{max-width:390px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px;pointer-events:auto;box-shadow:var(--shadow)}
.navbar button{display:flex;align-items:center;height:54px;padding:0 17px;border-radius:999px;color:var(--muted);gap:0;transition:background-color .4s var(--ease),color .3s,padding .45s var(--spring),gap .45s var(--spring),transform .35s var(--spring)}
.navbar button span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-weight:700;font-size:14px;transition:max-width .45s var(--spring),opacity .25s .05s}
.navbar button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);padding:0 20px 0 17px;gap:8px}
.navbar button[aria-current="page"] span{max-width:84px;opacity:1}
.navbar button[aria-current="page"] svg{animation:hop .5s var(--spring)}
@keyframes hop{30%{transform:translateY(-4px) scale(1.1)}}

/* dock */
#dock{position:fixed;left:0;right:0;z-index:26;bottom:calc(16px + env(safe-area-inset-bottom,0px) + 80px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));pointer-events:none}
#dock .dock,#dock .dock-btn{pointer-events:auto}
#shade{position:fixed;inset:0;z-index:25;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
#shade.on{opacity:1;pointer-events:auto}
.dock-grab{width:36px;height:4px;border-radius:4px;background:var(--surface-3);margin:-2px auto 6px;flex:none}
.dock-main,.dock-grab{touch-action:none}
.dock{max-width:430px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:10px 10px 10px 18px;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:dockIn .5s var(--spring)}
@keyframes dockIn{from{transform:translateY(30px);opacity:0}}
.dock-main{display:flex;align-items:center;gap:12px}
.dock-main .info{flex:1;min-width:0;text-align:left;padding:4px 0}
.dock-main .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--accent-fg)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.dock-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.dock.open .dock-more{grid-template-rows:1fr}
.dock-more>div{overflow:hidden;min-height:0}
.dock-more .inner{display:flex;flex-direction:column;gap:12px;padding:14px 8px 6px 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:16px;padding:12px 14px;min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:700;margin-top:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rest{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:20px;padding:8px 14px 8px 8px;margin:10px 8px 2px 0;animation:dockIn .4s var(--spring)}
.ring{width:44px;height:44px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--surface-3)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rest .tt{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.err{color:var(--danger);font-size:14px;line-height:1.45;margin:0}

/* workout */
.hero h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.prog{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .6s var(--spring)}
.ex{gap:16px;transition:border-color .4s var(--ease),opacity .3s}
.ex.allDone{border-color:var(--accent-line)}
.ex.skipped{opacity:.5}
.ex-head{display:flex;align-items:center;gap:12px}
.ex-ic{width:44px;height:44px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none;transition:background-color .3s,color .3s}
.allDone .ex-ic{background:var(--accent);color:var(--accent-ink)}
.ex-head .nm{flex:1;min-width:0}
.ex-head h3{font-size:17px;font-weight:700;line-height:1.25}
.ex-head .mu{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:4px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp-l{font-size:12px;color:var(--muted);margin:0 0 6px 4px}
.stp{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;background:var(--surface-2);border-radius:999px;padding:4px}
.stp button{height:40px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;color:var(--fg)}
.stp input{width:100%;min-width:0;background:transparent;border:0;text-align:center;font-size:20px;font-weight:700;padding:0;outline:none;font-variant-numeric:tabular-nums}
.stp.bump input{animation:bump .35s var(--spring)}
@keyframes bump{40%{transform:scale(1.22)}}
.sets{display:flex;flex-direction:column;gap:8px}
.set{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;border-radius:16px;padding:8px 8px 8px 16px;background:var(--surface-2);border:1.5px solid transparent;cursor:pointer;transition:border-color .25s,background-color .3s}
.set.cur{border-color:var(--accent-line)}
.set .n{font-size:13px;color:var(--muted);font-weight:600;width:42px}
.set .w{font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.set.done{background:var(--accent-soft)}
.set.done .w{color:var(--fg)}
.check{width:40px;height:40px;border-radius:50%;border:2px solid var(--surface-3);display:grid;place-items:center;color:transparent}
.set.done .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pop .45s var(--spring)}
.set.done .check::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);animation:burst .55s var(--ease) forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes burst{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.set{animation:setIn .35s var(--spring)}
@keyframes setIn{from{opacity:0;transform:translateY(-6px)}}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.last{font-size:12px;color:var(--faint)}
.sum-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.sum-list li{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.sum-list .tn{font-size:13px;color:var(--muted);text-align:right}

/* plan */
.ex-row{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 8px 14px 18px;display:flex;align-items:center;gap:6px;min-width:0}
.ex-row .info{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:6px;padding:4px 0;border-radius:12px}
.ex-row .mu{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.ex-row .nm{font-size:16px;font-weight:700}
.ex-row .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex-row .acts{display:flex}
.ex-row .acts button{width:36px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:12px}
.ex-row .acts button:disabled{opacity:.2;cursor:default}

/* charts */
.wave{position:relative;height:110px;margin:6px 0 0}
.wave svg{width:100%;height:100%;display:block;overflow:visible}
.wave .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.wave .area{opacity:.9}
.wave .base{stroke:var(--surface-3);stroke-width:2;stroke-dasharray:3 6;vector-effect:non-scaling-stroke;fill:none}
.knob{position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--surface-3);transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.tip{position:absolute;transform:translate(-50%,calc(-100% - 16px));white-space:nowrap}
.xlabels{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
.xlabels span b{display:block;font-weight:500;color:var(--faint);margin-top:4px;font-size:12px}
.xlabels .on{color:var(--accent-fg)}
.caps{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;height:150px;padding-top:30px}
.cap{flex:1;display:flex;flex-direction:column;align-items:center;gap:10px;height:100%;min-width:0}
.cap .track{flex:1;width:100%;max-width:38px;display:flex;align-items:flex-end;position:relative}
.cap .fill{width:100%;border-radius:999px;background:var(--surface-3);min-height:38px;transform-origin:bottom}
.cap.on .fill{background:var(--accent)}
.cap .lb{font-size:11px;color:var(--faint);white-space:nowrap}
.cap.on .lb{color:var(--accent-fg)}
.cap .tip{left:50%;top:auto;bottom:100%;transform:translate(-50%,-8px)}
.minibars{display:flex;align-items:flex-end;gap:3px;height:36px}
.minibars i{flex:1;border-radius:3px;background:var(--surface-3);min-height:6px}
.minibars i.on{background:var(--accent)}
.segs{display:flex;gap:5px}
.segs i{flex:1;height:6px;border-radius:6px;background:var(--surface-3)}
.segs i.on{background:var(--accent)}
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big .v{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.big .u{font-size:17px;color:var(--muted);font-weight:500}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tile .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500;margin-left:4px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.li:first-child{border-top:0;padding-top:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted);margin-top:3px}
.vol-row{display:grid;grid-template-columns:78px 1fr 26px;gap:12px;align-items:center;font-size:14px}
.vol-track{height:10px;border-radius:999px;background:var(--surface-3);position:relative;overflow:hidden}
.vol-track i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px;transform-origin:left}
.vol-row .tn{text-align:right;color:var(--muted)}
.minmax{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.minmax b{color:var(--fg);font-weight:600;font-size:15px}
.streak-pill{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 14px 8px 10px;font-weight:700}

/* profile */
.prof{display:flex;align-items:center;gap:16px}
.prof .avatar{width:68px;height:68px;font-size:26px}
.prof h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;color:var(--muted);text-transform:capitalize}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.set-line{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:50px}
.set-line>span{font-weight:500}
.mini-step{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:4px}
.mini-step button{width:36px;height:36px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center}
.mini-step .tn{min-width:52px;text-align:center;font-weight:700}
.ms-in{display:inline-flex;align-items:center;justify-content:center;min-width:52px;font-weight:700;cursor:text}
.ms-in input{width:34px;background:transparent;border:0;outline:none;padding:0;text-align:center;font:inherit;font-weight:700;color:var(--fg);min-width:0}
.ms-in input:focus{color:var(--lime)}
.stp input:focus{color:var(--lime)}
body.kb #dock,body.kb #nav{opacity:0;pointer-events:none;transform:translateY(40px);transition:opacity .15s,transform .15s}
.field{width:100%;height:52px;background:var(--surface-2);border:1.5px solid transparent;border-radius:16px;padding:0 16px;font-size:16px;transition:border-color .2s}
.field:focus{border-color:var(--accent-line);outline:none}
.flabel{font-size:13px;color:var(--muted);margin:0 0 8px 4px;display:block;font-weight:500}
select.field{appearance:none}
textarea.field{height:auto;min-height:250px;padding:16px;line-height:1.6;resize:vertical;font-size:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* sheet */
#sheetRoot .shade{position:fixed;inset:0;z-index:50;background:var(--scrim);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fade .25s var(--ease)}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:var(--surface);border-radius:32px 32px 0 0;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;padding:0 0 calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 120px 0 0 var(--surface);animation:rise .42s cubic-bezier(.16,1,.3,1);scrollbar-width:none;-ms-overflow-style:none}
.sheet::-webkit-scrollbar,.msgs::-webkit-scrollbar,.mlist::-webkit-scrollbar,.dock-more .inner::-webkit-scrollbar{display:none;width:0;height:0}
.msgs,.mlist,.dock-more .inner{scrollbar-width:none;-ms-overflow-style:none}
#sheetRoot.closing{pointer-events:none}
#sheetRoot.closing .shade{animation:fade .22s var(--ease) reverse forwards}
#sheetRoot.closing .sheet{animation:sink .24s var(--ease) forwards}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}}
@keyframes sink{to{transform:translateY(100%)}}
.sheet-grab{position:absolute;top:10px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:var(--surface-3)}
.sheet-head{touch-action:none;display:flex;align-items:center;gap:12px;padding:28px 20px 16px;position:sticky;top:0;background:var(--surface);z-index:1;border-radius:32px 32px 0 0}
.sheet-head .t{flex:1;min-width:0}
.sheet-head .t span{font-size:13px;color:var(--muted);font-weight:500}
.sheet-head h2{font-size:22px;font-weight:700;margin-top:2px}
.sq{width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.sheet-body{padding:6px 20px 8px;display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;gap:16px;background:var(--surface-2);border-radius:22px;padding:18px;text-align:left;width:100%}
.opt .ic{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.opt b{display:block;font-size:16px;font-weight:700;margin-bottom:4px}
.opt span{color:var(--muted);font-size:14px;line-height:1.35}
.foot-note{text-align:center;font-size:12px;color:var(--faint);margin-top:4px}
.day-opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-radius:20px;background:var(--surface-2);text-align:left;width:100%;border:1.5px solid transparent}
.day-opt[aria-current="true"]{border-color:var(--accent-line)}
.day-opt b{font-weight:700;display:block;margin-bottom:3px}
.day-opt span{color:var(--muted);font-size:13px}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.month .h{font-size:12px;color:var(--faint);padding:4px 0;font-weight:600}
.month button{aspect-ratio:1;max-width:100%;border-radius:50%;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.month button.has{background:var(--accent);color:var(--accent-ink)}
.month button.today:not(.has){box-shadow:inset 0 0 0 1.5px var(--accent-line);color:var(--accent-fg)}
.month button.out{opacity:.25}
.pv{background:var(--surface-2);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.pv ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--muted)}

#toast{position:fixed;left:0;right:0;top:calc(12px + env(safe-area-inset-top,0px));z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:11px 12px 11px 18px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:14px;box-shadow:var(--shadow);animation:drop .45s var(--spring)}
.toast button{background:var(--accent-ink);color:var(--accent);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
@keyframes drop{from{transform:translateY(-30px) scale(.9);opacity:0}}

/* page enter */
.enter>*{animation:up .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.enter .cap .fill{animation:grow .8s var(--spring) both;animation-delay:calc(var(--i,0)*45ms + 150ms)}
.enter .vol-track i,.enter .prog i{animation:growX .8s var(--ease) both;animation-delay:.2s}
.enter .wave .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease) .2s forwards}
.enter .wave .area,.enter .knob,.enter .tip{animation:fade .5s var(--ease) .8s both}
@keyframes grow{from{transform:scaleY(.15);opacity:.3}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
/* depth layer: soft top highlight on raised things, soft inner shadow on wells */
:root{--hi:rgba(255,255,255,.06);--lo:rgba(0,0,0,.3);--well:rgba(0,0,0,.38);--raise:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 70%);--surf:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 50%);--lime:linear-gradient(180deg,#cbf77e 0%,#bef264 55%,#b2e655 100%)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--hi:rgba(255,255,255,.95);--lo:rgba(40,50,20,.09);--well:rgba(40,50,20,.1);--raise:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));--surf:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0))}}
:root[data-theme="light"]{--hi:rgba(255,255,255,.95);--lo:rgba(40,50,20,.09);--well:rgba(40,50,20,.1);--raise:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));--surf:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0))}
/* lime surfaces */
.btn-primary,.day.sel,.navbar button[aria-current="page"],.chip[aria-pressed="true"],.chip[aria-selected="true"],.seg button[aria-pressed="true"],.set.done .check,.opt .ic,.month button.has,.avatar,.streak-pill,.cap.on .fill{background:var(--lime);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(60,90,0,.18)}
.badge.solid,.vol-track i,.prog i,.minibars i.on,.segs i.on{background:var(--lime);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.avatar{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(60,90,0,.18),0 0 0 4px var(--accent-soft)}
.btn-primary:active{box-shadow:inset 0 2px 3px rgba(60,90,0,.28)}
/* day strip: each day is a small raised pill */
.week{gap:6px}
.day:not(.sel){background:var(--surface) var(--raise);box-shadow:inset 0 1px 0 var(--hi),0 1px 2px var(--lo)}
.day:not(.sel):active{box-shadow:inset 0 2px 3px var(--well)}
/* cards and floating bars */
.card,.tile,.ex-row{background-image:var(--surf);box-shadow:inset 0 1px 0 var(--hi),0 2px 6px -3px var(--lo)}
.navbar,.dock{background-image:var(--surf);box-shadow:inset 0 1px 0 var(--hi),var(--shadow)}
.sheet{background-image:none;box-shadow:inset 0 1px 0 var(--hi),0 120px 0 0 var(--surface)}
/* raised controls */
.stp button,.mini-step button,.icon-round,.sq,.btn-ghost,.chip:not([aria-pressed="true"]):not([aria-selected="true"]):not(.round),.opt,.day-opt{background-image:var(--raise);box-shadow:inset 0 1px 0 var(--hi),0 1px 2px var(--lo)}
.stp button:active,.mini-step button:active,.icon-round:active,.sq:active,.btn-ghost:active,.chip:active{box-shadow:inset 0 2px 3px var(--well)}
.cap .fill{background-image:var(--raise);box-shadow:inset 0 1px 0 var(--hi)}
.cap.on .fill{background:var(--lime)}
/* recessed wells */
.stp,.kv-grid,.field,.seg,.mini-step,.stat,.rest,.vol-track,.prog,.check,.set:not(.done){box-shadow:inset 0 1.5px 3px var(--well),inset 0 -1px 0 var(--hi)}
.set.done .check{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(60,90,0,.18)}
/* brand */
.brand-tile{width:54px;height:54px;border-radius:18px;flex:none;display:grid;place-items:center;background:linear-gradient(180deg,#262626,#151515);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 0 rgba(0,0,0,.45),0 6px 16px -6px rgba(0,0,0,.7)}
.brand-tile.lg{width:68px;height:68px;border-radius:22px}
.brand-tile .logo{display:block}
.brand-hero{display:flex;justify-content:center;align-items:center;padding:4px 0}
.brand-hero.sm{justify-content:flex-start}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;pointer-events:none;transition:opacity .4s var(--ease)}
#splash.out{opacity:0}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:14px;animation:spIn .7s var(--spring) both}
#splash .sp-name{font-weight:800;font-size:20px;letter-spacing:-.01em;color:var(--fg)}
@keyframes spIn{from{opacity:0;transform:scale(.8) translateY(8px)}}
/* progress v3 */
.bodymap{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.bm{stroke:var(--surface);stroke-width:1.2;stroke-linejoin:round;transition:fill .3s}
.bm-base,.bm-h0{fill:var(--surface-3)}
.bm-h1{fill:rgba(190,242,100,.35)}.bm-h2{fill:rgba(190,242,100,.68)}.bm-h3{fill:#bef264}
path[data-a]{cursor:pointer}
.bm-sel{stroke:var(--fg);stroke-width:1.8}
.bm-t{fill:var(--faint);font-size:9px;font-family:var(--font)}
.legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.legend i.bm-h0{background:var(--surface-3)}.legend i.bm-h1{background:rgba(190,242,100,.35)}.legend i.bm-h2{background:rgba(190,242,100,.68)}.legend i.bm-h3{background:#bef264}
.mapinfo{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:inset 0 1px 0 var(--hi)}
.mapinfo .faint{font-size:12px}
.rep-h{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.rep-sec{display:flex;flex-direction:column;gap:8px}
.rep-t{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.rep-i{display:flex;align-items:center;gap:10px;text-align:left;width:100%;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.4;box-shadow:inset 0 1px 0 var(--hi)}
.rep-i>span:nth-child(2){flex:1}
.ri{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:12px}
.ri.ok{background:var(--lime);color:var(--accent-ink)}
.ri.warn{background:rgba(253,224,71,.18);color:var(--c-yellow)}
.focus{display:grid;gap:8px}
.focus button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 1px 0 var(--hi),0 1px 2px var(--lo)}
.focus button span{font-size:12.5px;color:var(--muted)}
.focus button.on{background:var(--lime);color:var(--accent-ink)}
.focus button.on span{color:rgba(21,21,21,.7)}
.say{display:flex;gap:10px;align-items:flex-start;margin:10px 8px 0 0;padding:10px 12px;border-radius:18px 18px 18px 6px;background:var(--surface-2);font-size:14px;line-height:1.45;box-shadow:inset 0 1px 0 var(--hi);animation:dockIn .4s var(--spring)}
.lift-row.sel{background:var(--surface-2);padding-left:8px;padding-right:8px}
details.more summary{list-style:none;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
/* compact exercise cards */
.exc{padding:12px 14px}
.exc-row{display:flex;align-items:center;gap:12px}
.exc-main{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px;border-radius:12px;padding:2px 0}
.exc-n{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exc-s{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exc.done{opacity:.75}
.ex-ic.sm{width:38px;height:38px;border-radius:12px}
.dots{display:flex;gap:4px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.dots i.on{background:var(--accent)}
.ex-head .nm.exc-main h3{font-size:17px;font-weight:700;line-height:1.25}
.ex-head .mu{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:-4px}
.tchip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 4px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 1px 0 var(--hi)}
.tchip .tic{width:26px;height:26px;border-radius:50%;font-size:13px}
.tchip b{font-size:14px}
.why-pop{display:flex;flex-direction:column;gap:6px;margin-top:-6px;padding:2px 2px 0;animation:up .25s var(--ease)}
.note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--accent-fg);margin-top:-4px;animation:up .3s var(--ease)}
.note.down{color:var(--danger)}
.note.ai{color:var(--fg)}
.ex-foot{justify-content:flex-start;gap:16px}
.sheet,.dock{will-change:transform}
html.native .shade,html.native #shade{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:rgba(0,0,0,.72)}
@media (hover:none){#sheetRoot .shade,#shade{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}}
/* exercise guides */
.ex-ic.thumb{padding:0;overflow:hidden;background:#fff}
.ex-ic.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ex-ic.thumb.nopic{background:var(--surface-2)}
.ex-ic.thumb.nopic img{display:none}
.ex-ic.pthumb{width:40px;height:40px;border-radius:12px;margin-right:4px}
.ex-row .ex-ic:not(.thumb){width:40px;height:40px;border-radius:12px;margin-right:4px;color:var(--muted)}
.mviewer{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:20px;overflow:hidden;background:#fff}
.mviewer.skel{background:var(--surface-2)}
.mviewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mviewer img.f1{animation:xf 2.4s ease-in-out infinite}
@keyframes xf{0%,35%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
.mviewer img.broken{display:none}
.msrc{position:absolute;right:8px;bottom:8px;font-size:10.5px;font-weight:600;color:#333;background:rgba(255,255,255,.85);border-radius:6px;padding:2px 6px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.5;font-size:14px}
.steps li::marker{color:var(--accent-fg);font-weight:700}
.mlist{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow:auto}
.mrow{flex:none;display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;text-align:left;width:100%}
.mrow img,.mrow .mph{width:52px;height:40px;border-radius:10px;object-fit:cover;background:#fff;flex:none}
.mrow .mph{background:var(--surface-2)}
.mrow>span:not(.mph){display:flex;flex-direction:column;gap:2px;min-width:0}
a.btn{text-decoration:none}
/* phases, setup, feel bar */
.ph{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips .chip{height:34px;padding:0 13px;font-size:13px}
.chk{display:grid;gap:8px}
.chk-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chk-row>span{font-size:14px;font-weight:500;min-width:0}
.chk-row .seg button{padding:0 11px;font-size:13px}
.wk-list{display:grid;gap:2px}
.wk-row{display:grid;grid-template-columns:minmax(0,1fr) 38% auto;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;text-align:left}
.wk-row.sel{background:var(--surface-2)}
.wk-n{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.wk-f{font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--accent-ink);background:var(--lime);border-radius:999px;padding:1px 6px}
.wk-bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 1px 2px var(--lo)}
.wk-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,#d4f88f,var(--lime) 55%,#a6d94e);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.wk-v{font-size:13px;color:var(--muted);min-width:44px;text-align:right}
.phase-box{display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border-radius:14px;padding:10px 12px;box-shadow:inset 0 1px 0 var(--hi)}
.feelbar{display:flex;flex-direction:column;gap:8px;margin:10px 8px 0 0;padding:10px 12px;border-radius:20px;background:var(--surface-2);box-shadow:inset 0 1px 0 var(--hi);animation:dockIn .4s var(--spring)}
.fb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feel3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel3 button{height:42px;border-radius:999px;font-weight:700;font-size:14px;background:var(--surface-3);color:var(--fg);box-shadow:inset 0 1px 0 var(--hi),0 1px 2px var(--lo)}
.feel3 button.on{background:var(--lime);color:var(--accent-ink);animation:pop .4s var(--spring)}
.rir{font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-3);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.rir.fail{color:var(--danger);background:rgba(255,138,128,.14)}
.sug.ai{background:var(--lime);color:var(--accent-ink)}
.sug-why.ai{display:flex;gap:8px;align-items:flex-start;color:var(--fg);line-height:1.45}
.optgrid{display:flex;flex-wrap:wrap;gap:8px}

const PUSH=['Chest','Shoulders','Triceps'], PULL=['Back','Biceps'];
function liftSessions(name){
  const n=(name||'').toLowerCase(), out=[];
  for(const s of sorted()){const e=s.exercises.find(x=>x.name.toLowerCase()===n);if(!e||!e.sets.length)continue;
    const top=e.sets.reduce((a,b)=>b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a);
    out.push({date:s.date,w:top.w,r:top.r,e:e1rm(top.w,top.r),sets:e.sets,sid:s.id,muscle:e.muscle})}
  let best=-1; out.forEach(p=>{p.pr=best>=0&&p.e>best+1e-9;best=Math.max(best,p.e)});
  return out;
}
function liftStatus(name){
  const L=liftSessions(name), n=L.length;
  if(n<3) return {key:'new',label:'New',why:`Status shows after 3 sessions (${n} so far)`,L};
  const e=L.map(x=>x.e), last=e[n-1], prev=e.slice(Math.max(0,n-4),n-1), avg=prev.reduce((a,b)=>a+b,0)/prev.length;
  if(last<avg*0.95) return {key:'dropping',label:'Dropping',why:`Last session ${Math.round((1-last/avg)*100)}% below your recent average`,L};
  const before=n>=4?Math.max(...e.slice(0,n-3)):e[0], recent=Math.max(...e.slice(n-3));
  if(recent>before*1.005) return {key:'progressing',label:'Progressing',why:`Estimated max up ${fmtW(recent-before)} ${U()} on your earlier best`,L};
  return {key:'stalled',label:'Stalled',why:'No better set in your last 3 sessions',L};
}
function mainLifts(){
  const starred=[],firsts=[];
  S.plan.forEach(d=>{d.exercises.forEach(e=>{if(e.star)starred.push(e.name)});const f=d.exercises[0];if(f)firsts.push(f.name)});
  const list=starred.length?starred:firsts, seen=new Set();
  return list.filter(n=>{const k=n.toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
}
const last7=()=>{const t=todayISO(),f=addDays(t,-6);return S.sessions.filter(s=>s.date>=f&&s.date<=t)};
const weekSessions=ws=>{const we=addDays(ws,6);return S.sessions.filter(s=>s.date>=ws&&s.date<=we)};
function musclesSets(list){const m={};list.forEach(s=>s.exercises.forEach(e=>m[e.muscle]=(m[e.muscle]||0)+e.sets.length));return m}
function balanceOf(m){const g=k=>k.reduce((a,x)=>a+(m[x]||0),0);return {push:g(PUSH),pull:g(PULL),legs:m.Legs||0,core:m.Core||0}}
function balanceFlag(b){
  const tot=b.push+b.pull+b.legs+b.core; if(tot<6) return null;
  if(b.push>0&&b.pull<b.push*0.7) return `Pull is ${Math.round(b.pull/b.push*100)}% of push in the last 7 days`;
  if(b.pull>0&&b.push<b.pull*0.7) return `Push is ${Math.round(b.push/b.pull*100)}% of pull in the last 7 days`;
  if(b.legs<tot*0.2) return `Legs are ${Math.round(b.legs/tot*100)}% of your sets in the last 7 days`;

}
function daysSince(muscle){const s=sorted().reverse().find(x=>x.exercises.some(e=>e.muscle===muscle));return s?diffDays(s.date,todayISO()):null}
function bodyTrend(){
  const w=[...S.profile.weights].sort((a,b)=>a.date<b.date?-1:1); if(!w.length) return null;
  const t=todayISO(), last7=w.filter(x=>diffDays(x.date,t)<7), base=last7.length?last7:[w.at(-1)];
  const avg7=base.reduce((a,x)=>a+x.kg,0)/base.length;
  const r=w.filter(x=>diffDays(x.date,t)<=28); let perWeek=null;
  if(r.length>=2&&diffDays(r[0].date,r.at(-1).date)>=7){
    const xs=r.map(x=>diffDays(r[0].date,x.date)), ys=r.map(x=>x.kg), mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length;
    const num=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0), den=xs.reduce((a,x)=>a+(x-mx)**2,0); if(den>0) perWeek=num/den*7;
  }
  const series=w.map(x=>{const win=w.filter(y=>y.date<=x.date&&diffDays(y.date,x.date)<7);return {date:x.date,raw:x.kg,avg:win.reduce((a,y)=>a+y.kg,0)/win.length}});
  return {avg7,perWeek,series};
}

/* ---------- render ---------- */
const isRip=n=>n.nodeType===1&&n.classList.contains('rip');
function updateNode(f,t){
  if(f.nodeType!==1){if(f.nodeValue!==t.nodeValue)f.nodeValue=t.nodeValue;return}
  for(const a of [...f.attributes]) if(!t.hasAttribute(a.name)) f.removeAttribute(a.name);
  for(const a of [...t.attributes]) if(f.getAttribute(a.name)!==a.value) f.setAttribute(a.name,a.value);
  if(f.tagName==='INPUT'){if(f!==document.activeElement){const v=t.getAttribute('value')??'';if(f.value!==v)f.value=v}return}
  if(f.tagName==='TEXTAREA'){if(f!==document.activeElement&&f.value!==t.value)f.value=t.value;return}
  if(f.tagName==='SELECT'){f.innerHTML=t.innerHTML;return}
  morphChildren(f,t);
}
function morphChildren(from,to){
  const kids=[...from.childNodes], used=new Set(), byId=new Map();
  kids.forEach(n=>{if(n.nodeType===1&&n.id)byId.set(n.id,n)});
  let ptr=0, prev=null;
  for(const t of [...to.childNodes]){
    let f=null;
    if(t.nodeType===1&&t.id){f=byId.get(t.id)||null;if(f&&(used.has(f)||f.nodeName!==t.nodeName))f=null}
    else{
      while(ptr<kids.length){const c=kids[ptr];if(used.has(c)||isRip(c)||(c.nodeType===1&&c.id)){ptr++;continue}break}
      const c=kids[ptr];if(c&&c.nodeType===t.nodeType&&c.nodeName===t.nodeName){f=c;ptr++}
    }
    if(f){used.add(f);updateNode(f,t)}else f=t;
    let ref=prev?prev.nextSibling:from.firstChild;
    while(ref&&isRip(ref))ref=ref.nextSibling;
    if(f!==ref)from.insertBefore(f,ref);
    prev=f;
  }
  kids.forEach(n=>{if(!used.has(n)&&!isRip(n)&&n.parentNode===from)n.remove()});
}
function patch(el,html){const t=el.cloneNode(false);t.innerHTML=html;morphChildren(el,t)}

  const nowOpen=ui.view==='workout'&&!!S.active&&(ui.dockOpen||!!ui.finish);
  if(nowOpen&&!dockTracked){dockTracked=true;ovOpen()} else if(!nowOpen&&dockTracked){dockTracked=false;ovClosed()}
  if(ui.view==='workout'&&S.active){h=dockWorkout();shade=ui.dockOpen||!!ui.finish}
  else if(ui.view==='plan'&&S.plan.length) h=`<div class="dock-btn" style="max-width:430px;margin:0 auto"><button class="btn btn-primary btn-block tap" style="height:58px;font-size:17px" data-a="addEx">${I('plus',20)} Add Exercise</button></div>`;
  const kind=h?(h.startsWith('<div class="dock-btn')?'btn':'w'):'';
  if(dock.dataset.kind!==kind){dock.innerHTML=h;dock.dataset.kind=kind}else if(h)patch(dock,h);
  $('#shade').classList.toggle('on',shade);
  requestAnimationFrame(()=>{const el=dock.firstElementChild;const hgt=el?el.offsetHeight:0;$('#app').style.paddingBottom=(Math.min(hgt,140)+130)+'px'});
}

function loadDemo(){

  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const t=todayISO(), base={}, startW=e=>{const n=e.name.toLowerCase();if(/raise|fly|kickback/.test(n))return 7.5;if(/curl/.test(n)&&!/leg/.test(n))return /ez|barbell/.test(n)?20:10;
    return {Chest:40,Back:45,Shoulders:30,Biceps:12,Triceps:20,Legs:/press/.test(n)?100:50,Core:20,Other:20}[e.muscle]||20};
  let di=0;
  for(let k=42;k>=1;k--){const d=addDays(t,-k),wd=(parseISO(d).getDay()+6)%7;if(![0,2,4].includes(wd)||S.sessions.some(s=>s.date===d))continue;

    const st=parseISO(d);st.setHours(18,30+Math.floor(rnd()*30));

  }
  for(let k=42;k>=1;k-=4) if(!S.profile.weights.some(w=>w.date===addDays(t,-k))) S.profile.weights.push({date:addDays(t,-k),kg:Math.round((76.6-(42-k)*.035+(rnd()-.5)*.6)*10)/10,demo:true});

  if(todayISO()!==ui.today){if(ui.sel===ui.today)ui.sel=todayISO();ui.today=todayISO();ui.curSet={};render();return}
  const a=S.active;
  if(a&&a.started){const t=mmss(Date.now()-a.started);document.querySelectorAll('[data-tick="el"],[data-tick="el2"]').forEach(n=>n.textContent=t)}
  if(ui.restEnd){const left=ui.restEnd-Date.now();
    if(left<=0){ui.restEnd=0;buzz([80,60,80]);if(ui.view==='workout'){renderDock();toast('Rest over. Next set!')}return}
    const r=document.querySelector('[data-tick="rest"]');if(r)r.textContent=mmss(left);
    const c=document.querySelector('[data-tick="ring"]');if(c){const C=2*Math.PI*19;c.setAttribute('stroke-dashoffset',(C*(1-left/ui.restTotal)).toFixed(1))}}
},1000);

(()=>{const sp=$('#splash');if(!sp)return;sp.innerHTML=`<div class="sp-in">${logoMark(112)}<div class="sp-name">Flowfit</div></div>`;setTimeout(()=>sp.classList.add('out'),650);setTimeout(()=>sp.remove(),1100)})();
buildNav(); render();
if(!S.profile.train&&!S.profile.trainSkip)setTimeout(()=>act.setupOpen(),600);
</script>

<script src="native-bridge.js"></script>
</body>
