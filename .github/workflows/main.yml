name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Use the Android SDK already on the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" 
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icon and splash from assets/
        run: npx capacitor-assets generate --android

      - name: Copy web app into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: flowfit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk flowfit.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" flowfit.apk --title "Flowfit (build ${{ github.run_number }})" --notes "Latest Flowfit APK, built from ${GITHUB_SHA::7}." --latest
