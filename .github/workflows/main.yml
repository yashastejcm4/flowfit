name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Use the Android SDK already on the runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" 
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: App icon and splash from assets/
        run: npx capacitor-assets generate --android

      - name: Launch screen matches the in-app splash (sharp logo, same background)
        run: python3 scripts/android-splash.py

      - name: Stamp the build number into the app (used by "Check for updates")
        run: echo "window.FLOWFIT_BUILD=${{ github.run_number }};window.FLOWFIT_SHA='${GITHUB_SHA::7}';" > www/build.js

      - name: Copy web app into Android
        run: npx cap sync android

      - name: Sign with Flowfit's fixed key, so each new APK installs over the old one
        env:
          KS: ${{ secrets.FLOWFIT_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/flowfit.keystore"
            echo "SIGN_ARGS=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/flowfit.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android" >> "$GITHUB_ENV"
            echo "Fixed signing key in place"
          else
            echo "::warning::FLOWFIT_KEYSTORE secret is not set. This APK gets a random key and won't install over older builds."
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon $SIGN_ARGS

      - uses: actions/upload-artifact@v4
        with:
          name: flowfit-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk flowfit.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" flowfit.apk --title "Flowfit (build ${{ github.run_number }})" --notes "Latest Flowfit APK, built from ${GITHUB_SHA::7}." --latest
